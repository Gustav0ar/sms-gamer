[package]
name = "sms-gamer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "SMS Gamer UPS monitoring daemon and Varlink client"
license = "MIT"
repository = "https://github.com/Gustav0ar/sms-gamer"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
rustix = { version = "1.1.5", features = ["event", "fs", "system", "termios", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
signal-hook = "0.3.18"
tempfile = "3.27.0"
varlink = "13.0.0"

[build-dependencies]
varlink_generator = "13.0.0"

[dev-dependencies]
rustix = { version = "1.1.5", features = ["pty"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
