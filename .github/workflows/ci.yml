name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus dbus-bin systemd
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Decode protocol fixture
        run: ./target/release/sms-gamer decode tests/fixtures/gamer-2000.jsonl

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check advisories licenses sources

  plugin:
    name: Noctalia plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Luau CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/luau"
          gh release download 0.744 --repo luau-lang/luau --pattern luau-ubuntu.zip --dir "$RUNNER_TEMP/luau"
          cd "$RUNNER_TEMP/luau"
          echo '6506f0852c623aaffcb28494aac16c26dc04a269ea0e16cc0aafc8c8ac79f3ec  luau-ubuntu.zip' | sha256sum --check
          unzip luau-ubuntu.zip
          chmod +x luau luau-compile
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Compile plugin
        run: |
          for file in integrations/noctalia/sms-gamer/*.luau; do
            luau-compile "$file" > /dev/null
          done
      - name: Panel lifecycle tests
        run: node tests/noctalia.cjs

  privacy:
    name: Public tree and secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check public tree
        run: bash scripts/check-public-tree.sh
      - name: Install pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan Git history
        run: gitleaks git --redact --no-banner
